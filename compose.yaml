name: pcbuilder

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pcbuilder}
      POSTGRES_USER: ${POSTGRES_USER:-pcbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pcbuilder} -d ${POSTGRES_DB:-pcbuilder}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: ${IMAGE_REPO:-pcbuilder-api}:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pcbuilder}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-pcbuilder}
      # APP_VERSION не задаём: версия приходит из образа (build-arg при релизе),
      # иначе env перекрывает её и /health врёт про выкаченную версию.
      SEED_ON_START: ${SEED_ON_START:-true}
      # false — не запускать alembic при старте (например, если миграции делает
      # отдельный шаг деплоя или выполняется откат на старый образ)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
